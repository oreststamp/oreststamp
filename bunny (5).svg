    <g class="whiskR" stroke="#3A2A20" stroke-width="0.7" stroke-linecap="round" fill="none">
      <path d="M54.5 48.5 C58 45.5 62 45 65.5 48"/>
      <path d="M55 50.5 C58.5 49 62.5 50 66 53.5"/>
      <path d="M54.5 52.5 C58 53 61.5 54.5 64.5 58"/>
    </g>
    <path d="M50 49 v1.8 M50 50.8 q-3 2.6 -6 0 M50 50.8 q3 2.6 6 0" stroke="#2B1B12" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
  </g>
