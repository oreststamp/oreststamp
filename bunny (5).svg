    <circle cx="63.5" cy="49" r="3" fill="#F4A0A8" opacity="0.5"/>
    <ellipse cx="50" cy="49" rx="8.5" ry="6.2" fill="#DDBE92"/>
    <ellipse cx="50" cy="47" rx="2.6" ry="1.9" fill="#D9777F"/>
