    <ellipse cx="50" cy="40" rx="21" ry="18.5" fill="#8A6A4F" stroke="#5A4333" stroke-width="0.8"/>
    <g clip-path="url(#headClip)">
      <path d="M32 27 L35 22 L39 24 L42 20 L47 23 L49 21 L51 26 L48 29 L50 33 L45 35 L43 32 L40 37 L36 34 L33 36 L30 32 Z" fill="#DDBE92" stroke="#DDBE92" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M58 24 L62 21 L66 24 L65 28 L68 31 L63 32 L60 29 Z" fill="#DDBE92" stroke="#DDBE92" stroke-width="1.3" stroke-linejoin="round"/>
    </g>

    <!-- face -->
    <circle class="eye" cx="41" cy="42" r="2.6" fill="#2B1B12"/>
    <circle class="eye" cx="59" cy="42" r="2.6" fill="#2B1B12"/>
    <circle class="eye" cx="42" cy="41" r="0.9" fill="#FFFFFF"/>
