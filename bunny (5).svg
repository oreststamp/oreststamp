    @keyframes shadow {
      0%, 100% { transform: scale(1.05); opacity: 0.25; }
      50%      { transform: scale(0.6); opacity: 0.12; }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.1); }
    }
