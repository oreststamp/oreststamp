    <clipPath id="bodyClip"><ellipse cx="50" cy="72" rx="16" ry="15"/></clipPath>
  </defs>

  <ellipse class="shadow" cx="50" cy="90" rx="18" ry="3" fill="#000" opacity="0.25"/>

  <g class="bunny" stroke-linejoin="round">
    <!-- floppy ears (behind head) -->
