<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 100 134" width="100" height="134">
  <style>
    .bunny { transform-origin: 50px 88px; animation: jump 1.2s ease-in-out infinite; }
    .earL { transform-origin: 40px 29px; animation: flapL 1.2s linear infinite; }
    .earR { transform-origin: 60px 29px; animation: flapR 1.2s linear infinite; }
    .shadow { transform-origin: 50px 90px; animation: shadow 1.2s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 3.6s infinite; }
    .whiskL { transform-origin: 46px 50px; animation: twitchL 3.6s ease-in-out infinite; }
    .whiskR { transform-origin: 54px 50px; animation: twitchR 3.6s ease-in-out infinite; }
    @keyframes twitchL {
      0%, 60%, 100% { transform: rotate(0deg); }
      66% { transform: rotate(-5deg); }
      72% { transform: rotate(3deg); }
      78% { transform: rotate(0deg); }
    }
    @keyframes twitchR {
      0%, 60%, 100% { transform: rotate(0deg); }
      66% { transform: rotate(5deg); }
      72% { transform: rotate(-3deg); }
      78% { transform: rotate(0deg); }
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1.06, 0.94); }
      15%      { transform: translateY(0) scale(0.96, 1.06); }
      50%      { transform: translateY(-22px) scale(0.97, 1.04); }
      85%      { transform: translateY(0) scale(1, 1); }
    }
