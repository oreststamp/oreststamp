      63.33% { transform: rotate(13.23deg); }
      65.00% { transform: rotate(14.81deg); }
      66.67% { transform: rotate(16.27deg); }
      68.33% { transform: rotate(17.54deg); }
      70.00% { transform: rotate(18.54deg); }
