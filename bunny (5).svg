      <path d="M41 28 C32 24 20 34 20 50 C20 62 24 70 29 69 C35 68 36 56 36 44 C36 36 39 32 41 28 Z" fill="#A5958B" stroke="#6E6560" stroke-width="1.2"/>
      <path d="M38 33 C31 33 25 41 25 52 C25 60 27 64 29 63.5 C32 63 33 55 33 46 C33 40 35 36 38 33 Z" fill="#C9A9A0" opacity="0.55"/>
